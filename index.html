<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="authScreen">
      <h1>Tic Tac Toe</h1>

      <h2>Welcome</h2>

      <input type="email" id="emailInput" placeholder="Email" />

      <input type="password" id="passwordInput" placeholder="Password" />

      <button id="signUpButton">Sign Up</button>
      <button id="loginButton">Log In</button>

      <p>or</p>

      <button id="googleLoginButton">Continue with Google</button>

      <p id="authMessage"></p>
    </div>
    <!-------------------------------------------------------------------------->
    <div id="profileSetupScreen">
      <h1>Tic Tac Toe</h1>
      <h2>Create your profile</h2>
      <input
        type="text"
        id="usernameInput"
        placeholder="Enter your username"
        maxlength="20"
      />
      <label for="countrySelect">Country</label>

      <select id="countrySelect">
        <option value="">Select your country</option>
      </select>
      <button id="saveProfileButton">Continue</button>
    </div>

    <!-------------------------------------------------------------------------->

    <div id="lobbyScreen">
      <h1>Tic Tac Toe</h1>
      <button id="playButton">Play</button>
      <button id="logoutButton">Log Out</button>
    </div>
    <!-------------------------------------------------------------------------->

    <div id="waitingScreen">
      <h2>Finding an opponent...</h2>

      <button id="cancelSearch">Cancel</button>
    </div>

    <!-------------------------------------------------------------------------->

    <div id="matchFoundScreen">
      <h2>Opponent Found!</h2>
      <div id="playersMatchup">
        <div>
          <p id="myUsername"></p>
          <p id="mySymbol"></p>
        </div>

        <p>VS</p>

        <div>
          <p id="opponentName"></p>
          <p id="opponentSymbol"></p>
        </div>
      </div>
      <p>Get ready...</p>
      <p id="countdown">3</p>
    </div>

    <!-------------------------------------------------------------------------->

    <div id="gameScreen">
      <button id="leaveGame">Leave Game</button>

      <div id="notification"></div>

      <h1>Tic Tac Toe</h1>

      <div id="gamePlayers">
        <div class="gamePlayer">
          <p id="gameMyUsername"></p>
          <p id="gameMySymbol"></p>
          <p>YOU</p>
        </div>

        <p>VS</p>

        <div class="gamePlayer">
          <p id="gameOpponentUsername"></p>
          <p id="gameOpponentSymbol"></p>
          <p>OPPONENT</p>
        </div>
      </div>

      <div class="game">
        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>

        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>

        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>
      </div>

      <p id="message">Player X's turn</p>

      <button id="restart">Restart</button>
    </div>

    <!-------------------------------------------------------------------------->

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
